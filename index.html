<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <!-- Tailwind & Daisy UI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- Link-CSS -->
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-5xl mx-auto bg-[#F8FAFC]">
    <header>
        <h1 class="text-4xl font-bold text-[#002C5C] mt-12 mb-5">Job Application Tracker</h1>
        <div class="grid md:grid-cols-3 gap-4">
            <div class="border-0 rounded-xl shadow-sm p-5">
                <p class="text-[#323B49] font-normal text-lg mb-2 ">Total</p>
                <h2 id="total" class="text-[#002C5C] font-bold text-2xl">0</h2>
            </div>
            <div class="border-0 rounded-xl shadow-sm p-5">
                <p class="text-[#323B49] font-normal text-lg mb-2">Interview</p>
                <h2 id="interview" class="text-[#10B981] font-bold text-2xl">0</h2>
            </div>
            <div class="border-0 rounded-xl shadow-sm p-5">
                <p class="text-[#323B49] font-normal text-lg mb-2">Rejected</p>
                <h2 id="rejected" class="text-[#EF4444] font-bold text-2xl">0</h2>
            </div>
        </div>
        <div class="border-b-2 border-gray-100 mt-8"></div>
    </header>
    <script src="./script.js/script.js"></script>
</body>

</html>
